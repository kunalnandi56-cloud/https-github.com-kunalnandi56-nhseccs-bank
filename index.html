@media (prefers-color-scheme:dark){:root{--bg:#050E18;--card:#0B1C2E;--tx:#E8EDF3;--mut:#93A4B8;--bd:#1B3350;--hi:#E6CF94;--field:#08172A;--tint:rgba(230,207,148,.04);--ok:#3FCB9F;--bad:#F0768A;--shadow:0 16px 36px -24px #000;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--sans);padding-bottom:48px;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px}
@media (min-width:900px){.wrap{max-width:860px;padding:26px 20px}body{font-size:16px}}
h1,h2{font-family:var(--serif);color:var(--hi);font-weight:700;letter-spacing:.005em}
h1{font-size:28px;line-height:1.1;margin:2px 0 14px}h2{font-size:24px;line-height:1.15;margin:0 0 10px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* masthead */
.hd{position:relative;background:var(--pat),linear-gradient(135deg,#05172A 0%,#0E2A47 55%,#0A2038 100%);background-size:120px auto,auto;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px 24px}
.hd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent)}
.hdi{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px}
.seal svg{width:56px;height:56px;display:block}
.hd .s1{font-size:12px;color:var(--gold2);font-weight:600;letter-spacing:.02em}
.hd .s2{font-family:var(--serif);font-size:23px;line-height:1.1;font-weight:700;color:#fff;margin:3px 0}
.hd .s3{font-size:11.5px;color:#9FB2C8}
@media (max-width:380px){.hd .s2{font-size:19px}}

/* surfaces */
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid{margin-bottom:14px}.grid>.card{margin-bottom:0}.grid>.card:last-child:nth-child(even){grid-column:1/-1}
.grid>.card:first-child{grid-column:1/-1;background:var(--pat),linear-gradient(135deg,#06182A,#12385F);background-size:120px auto,auto;border:1px solid rgba(201,162,75,.5);color:#fff;padding:22px 20px}
.grid>.card:first-child .k{color:var(--gold2)}
.grid>.card:first-child .v{font-size:40px;color:#fff;line-height:1.05}
.k{color:var(--mut);font-size:12.5px;font-weight:500}
.v{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:lining-nums tabular-nums;color:var(--hi)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.sub{color:var(--mut);font-size:12.5px}
.note{font-size:12.5px;color:var(--mut);margin:8px 0}
.in{color:var(--ok);font-weight:700}.out{color:var(--bad);font-weight:700}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--bd)}
.badge.paid{color:var(--ok);background:rgba(15,123,95,.1);border-color:rgba(15,123,95,.35)}
.badge.due{color:var(--bad);background:rgba(163,38,56,.09);border-color:rgba(163,38,56,.35)}
.paid{color:var(--ok)}.due{color:var(--bad)}

/* fields and buttons */
input,select,textarea{font:inherit;color:var(--tx);background:var(--field);border:1px solid var(--bd);border-radius:8px;padding:12px 13px;max-width:100%;transition:border-color .15s,box-shadow .15s}
input,select{width:100%;min-height:48px;margin-bottom:10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.22)}
textarea{width:100%;min-height:150px;margin-bottom:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:12px 20px;font-weight:700;letter-spacing:.01em;color:#1A1203;background:linear-gradient(180deg,#E0BF68,#B98F34);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 8px 18px -8px rgba(140,109,38,.7);transition:filter .15s,transform .05s}
button:hover{filter:brightness(1.06)}button:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:default}
button.g{background:transparent;color:var(--hi);border:1px solid rgba(14,42,71,.28);box-shadow:none;font-weight:600;padding:8px 14px}
@media (prefers-color-scheme:dark){button.g{border-color:rgba(230,207,148,.35)}}
select.sel{margin-bottom:12px}
.fl{font-size:12.5px;color:var(--mut);margin:0 0 3px}
#e_name,#mn,#d_name{text-transform:uppercase}

/* member service buttons */
.bar{display:flex;gap:10px;margin-bottom:14px;align-items:center}
.mb{display:block;width:100%;margin:0 0 10px;padding:15px 18px;border-radius:8px;font-weight:700;text-align:center}
.mb.b-rule,.mb.b-mint{background:var(--card);color:var(--hi);border:1px solid var(--bd);box-shadow:var(--shadow);text-align:left;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.mb.b-rule::after,.mb.b-mint::after{content:"\203A";color:var(--gold);font-size:24px;line-height:1}
.mb.b-peach{background:transparent;color:var(--mut);border:1px solid var(--bd);box-shadow:none;font-weight:600}
.mb.b-red{background:transparent;color:var(--bad);border:1px solid rgba(163,38,56,.45);box-shadow:none;margin:0;font-weight:600}
.bar .sm{width:auto;white-space:nowrap;margin:0;padding:12px 16px;background:transparent;color:var(--hi);border:1px solid rgba(14,42,71,.28);box-shadow:none;font-weight:600}
.bar .b-red{flex:1}

/* account statement rows (the 13 items) */
.tgrid{display:grid;grid-template-columns:1fr;gap:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.tile{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:0;box-shadow:none;font-weight:500}
.tile:last-child{border-bottom:0}
.tile .k{color:var(--mut);font-size:14px;font-weight:500}
.tv{font-family:var(--serif);font-size:21px;font-weight:700;text-align:right;color:var(--hi);font-variant-numeric:lining-nums tabular-nums}
.tile.full{background:linear-gradient(135deg,#06182A,#12385F);border-bottom:2px solid var(--gold)}
.tile.full .k{color:var(--gold2)}.tile.full .tv,.tile.full .ti{color:#fff}
.ti{width:48%;margin:0;min-height:42px;text-align:right;font-family:var(--serif);font-size:20px;font-weight:700;background:var(--tint);color:var(--hi);border:1px solid var(--bd);padding:6px 10px;font-variant-numeric:lining-nums tabular-nums}
.tile.full .ti{width:64%;background:rgba(255,255,255,.08);border-color:rgba(230,207,148,.45)}
label.tile{cursor:text}

/* tables */
.xw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;margin-bottom:14px;background:var(--card);box-shadow:var(--shadow)}
.xt{border-collapse:collapse;font-size:13px;white-space:nowrap;width:100%;font-variant-numeric:tabular-nums}
.xt th{background:linear-gradient(180deg,#0E2A47,#081D33);color:var(--gold2);padding:11px 12px;font-weight:600;border-bottom:2px solid var(--gold)}
.xt td{border-bottom:1px solid var(--bd);padding:9px 12px;text-align:right;background:var(--card)}
.xt tr:nth-child(even) td{background:var(--tint)}
.xt td.n{text-align:left;position:sticky;left:0;background:var(--card);font-weight:600;color:var(--hi)}
.xt tr:nth-child(even) td.n{background:var(--card)}
.xt td.tt{font-weight:700;color:var(--hi);background:rgba(201,162,75,.14)}
.xt tr.t td{font-weight:700;background:linear-gradient(180deg,#EAD9A8,#DCC27A);color:#2A1E05;border-bottom:0}

/* bottom navigation */
.tabs{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));width:calc(100% - 24px);max-width:560px;margin:14px auto 0;display:flex;background:linear-gradient(180deg,#0E2A47,#06182A);border:1px solid rgba(201,162,75,.45);border-radius:14px;padding:4px;box-shadow:0 14px 30px -14px rgba(0,0,0,.7);z-index:10}
.tabs button{flex:1;background:none;box-shadow:none;color:#9FB2C8;border-radius:10px;padding:11px 2px;font-size:12.5px;font-weight:600}
.tabs button.on{color:#1A1203;background:linear-gradient(180deg,#E0BF68,#B98F34)}

/* sign-in pages */
body.gate{background:var(--pat),radial-gradient(120% 80% at 50% 0%,#12385F 0%,#071A2C 55%,#04111E 100%);background-size:120px auto,auto;background-attachment:fixed;padding-bottom:40px}
body.gate .hd{background:transparent;padding-bottom:18px}
body.gate .wrap{max-width:440px;padding-top:26px}
body.gate .card{border-top:3px solid var(--gold);padding:26px 22px}
body.gate .card button{width:100%;margin-bottom:8px;display:block}body.gate .card button.g{padding:12px 14px}
body.gate .note{color:var(--gold2)}
/* 3D buttons */
button{position:relative;top:0;margin-bottom:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.14),0 5px 0 #8C6D26,0 12px 18px -6px rgba(7,26,44,.55)}
button:active{top:4px;transform:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.14),0 1px 0 #8C6D26,0 4px 8px -4px rgba(7,26,44,.5)}
button.g{background:linear-gradient(180deg,#FFFFFF,#E7ECF2);color:var(--hi);border:1px solid #C5CEDA;box-shadow:inset 0 1px 0 #fff,0 4px 0 #AEB9C8,0 10px 14px -8px rgba(7,26,44,.4)}
button.g:active{top:3px;box-shadow:inset 0 1px 0 #fff,0 1px 0 #AEB9C8}
@media (prefers-color-scheme:dark){button.g{background:linear-gradient(180deg,#17324F,#0B1C2E);border-color:#2B4C74;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 0 #050E18,0 10px 14px -8px #000}button.g:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 0 #050E18}}
.b3d{display:block;width:100%;padding:19px 20px;font-size:17.5px;margin:0 0 18px;border-radius:10px}
.b3d.navy{background:linear-gradient(180deg,#2F6199,#0E2A47);color:#F3E2B0;border:1px solid #06182A;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.28),0 5px 0 #04101D,0 12px 18px -6px rgba(7,26,44,.6)}
.b3d.navy:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.28),0 1px 0 #04101D,0 4px 8px -4px rgba(7,26,44,.5)}
.tabs button,.tabs button:active{top:0;margin:0;box-shadow:none}
.tabs button.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 0 #8C6D26}
.mb.b-rule,.mb.b-mint{box-shadow:0 4px 0 #C5CEDA,0 12px 16px -10px rgba(7,26,44,.4)}
.mb.b-peach{box-shadow:0 3px 0 #C5CEDA}.mb.b-red{box-shadow:0 3px 0 rgba(163,38,56,.35)}
.bar .sm{margin:0}
body.gate .card button{margin-bottom:16px}body.gate .card .b3d{margin-bottom:18px}
/* emblem and watermark */
.seal img{width:68px;height:68px;border-radius:50%;display:block;box-shadow:0 0 0 2px rgba(201,162,75,.65),0 8px 20px rgba(0,0,0,.55)}

body.gate::after{opacity:.1}
@media print{body::after{opacity:.06}}
.pill{display:block;min-width:84px;text-align:right;padding:6px 14px;border:1px solid var(--bd);border-radius:99px;background:var(--tint);color:var(--tx)}
.is-installed #ginst,.is-installed #inst,.is-installed #ainst{display:none}
/* ===== pastel 3D buttons (v2) ===== */
button{--c1:#F8EAB8;--c2:#EBD186;--e:#B8962F;color:#33280A;background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid rgba(0,0,0,.05);text-shadow:0 1px 0 rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -3px 0 rgba(0,0,0,.05),0 5px 0 var(--e),0 12px 16px -8px rgba(7,26,44,.45)}
button:active{top:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 0 var(--e),0 4px 6px -4px rgba(7,26,44,.5)}
button.g,button.mb.b-rule,button.mb.b-mint,button.mb.b-peach,button.mb.b-red,button.b3d.navy,.bar button.sm{background:linear-gradient(180deg,var(--c1),var(--c2));color:#33280A;border:1px solid rgba(0,0,0,.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -3px 0 rgba(0,0,0,.05),0 5px 0 var(--e),0 12px 16px -8px rgba(7,26,44,.45)}
button.g:active,button.mb:active,button.b3d:active{top:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 0 var(--e)}
button.g{--c1:#DCEBFA;--c2:#B9D6F3;--e:#78A5D0}
button.mb{margin-bottom:12px}
/* colours */
#chg,#esave,#dsave,#dvsave2,#rsave,#lsave,#aasave,#cachg,#cpsave,#lm,#sc,#bxl{--c1:#F8EAB8;--c2:#EBD186;--e:#B8962F}
#xl,#ecan,#dvcancel,#bxl{--c1:#FBF4C4;--c2:#F1E48F;--e:#BDAE45}
#madd,#gadd,#gdv,#ltadd,#dbsave,#bdiv,#mgo,#bpgo,.g.ok{--c1:#D8F4E6;--c2:#B6E8D0;--e:#6DB896}
#la,#ago,#bapp,#inst,#ainst,[data-ed]{--c1:#DCEBFA;--c2:#B9D6F3;--e:#78A5D0}
#blist,#gchg,#gltl,#erst,#ginst,#unlock{--c1:#E8E0F9;--c2:#D0C2F1;--e:#9585C7}
#brules,#abk,#mback,#bout,#dbback,#dvb,#lout{--c1:#FDE3D2;--c2:#F8C8A8;--e:#D39772}
#lo,#bcp,#bk,[data-dm],.g.no{--c1:#FADCE6;--c2:#F4BDD0;--e:#C9809A}
#shw,#shw2,#shw3,#bbio{--c1:#D3F1F3;--c2:#ADE2E7;--e:#62B0BA}
#bbio{--c1:#D3F1F3;--c2:#ADE2E7}
.mb.b-rule::after,.mb.b-mint::after{color:#7a6320}
/* admin menu: six pastel buttons in two rows */
.tabs{position:static;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:calc(100% - 24px);max-width:560px;margin:14px auto 0;background:none;border:0;box-shadow:none;padding:0 0 6px;transform:none;left:auto}
.tabs button,.tabs button:active{margin:0;top:0;padding:13px 4px;font-size:13px;font-weight:700;color:#33280A;line-height:1.15}
.tabs button:nth-child(1){--c1:#F8EAB8;--c2:#EBD186;--e:#B8962F}
.tabs button:nth-child(2){--c1:#D8F4E6;--c2:#B6E8D0;--e:#6DB896}
.tabs button:nth-child(3){--c1:#DCEBFA;--c2:#B9D6F3;--e:#78A5D0}
.tabs button:nth-child(4){--c1:#E8E0F9;--c2:#D0C2F1;--e:#9585C7}
.tabs button:nth-child(5){--c1:#FDE3D2;--c2:#F8C8A8;--e:#D39772}
.tabs button:nth-child(6){--c1:#FADCE6;--c2:#F4BDD0;--e:#C9809A}
.tabs button{background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid rgba(0,0,0,.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -3px 0 rgba(0,0,0,.05),0 5px 0 var(--e),0 10px 14px -8px rgba(7,26,44,.45)}
.tabs button.on{top:3px;box-shadow:inset 0 2px 6px rgba(0,0,0,.18),0 2px 0 var(--e);outline:2px solid #0E2A47;outline-offset:1px}
@media (prefers-color-scheme:dark){.tabs button.on{outline-color:#E6CF94}}
/* summary figure buttons */
.sbtn{--c1:#F8EAB8;--c2:#EBD186;--e:#B8962F;border-radius:12px;padding:14px 16px;border:1px solid rgba(0,0,0,.05);background:linear-gradient(180deg,var(--c1),var(--c2));color:#33280A;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 5px 0 var(--e),0 12px 16px -8px rgba(7,26,44,.4)}
.sbtn .k{color:#4a3b14;font-size:13px;font-weight:600}.sbtn .sv{font-family:var(--serif);font-size:26px;font-weight:700;color:#1a1203;font-variant-numeric:lining-nums tabular-nums}
.s-in{--c1:#D8F4E6;--c2:#B6E8D0;--e:#6DB896}.s-out{--c1:#FADCE6;--c2:#F4BDD0;--e:#C9809A}
.grid>.sbtn{margin-bottom:6px}
.totdiv{font-family:var(--serif);font-size:34px;font-weight:800;color:var(--hi);margin-top:16px;line-height:1.1;font-variant-numeric:lining-nums tabular-nums}
.xt input,.xt select{min-width:130px;margin:0;min-height:40px;padding:6px 8px;width:100%}
.xt td .pill{min-width:70px;min-height:32px}

/* ===== v3: brighter look, print, locked fields ===== */
html:root{--bg:#F6F9FD;--card:#FFFFFF;--tx:#0F1B2A;--mut:#566A80;--bd:#D3DDE9;--hi:#0E2A47;--field:#FFFFFF;--tint:rgba(14,42,71,.04);--ok:#0F7B5F;--bad:#A32638;--shadow:0 1px 0 rgba(255,255,255,.9) inset,0 14px 30px -22px rgba(14,42,71,.35);color-scheme:light}
.hd{background:var(--pat),linear-gradient(135deg,#0F3A66 0%,#1C5A96 55%,#14477A 100%);background-size:120px auto,auto}
body.gate{background:var(--pat),radial-gradient(120% 80% at 50% 0%,#2C74B8 0%,#17518A 55%,#0F3F6E 100%);background-size:120px auto,auto;background-attachment:fixed}
.grid>.card:first-child,.tile.full{background:var(--pat),linear-gradient(135deg,#17508A,#2F78BC);background-size:120px auto,auto}
.xt th{background:linear-gradient(180deg,#2A6DB0,#17508A)}
body::after{opacity:.1}
input:disabled,select:disabled,textarea:disabled{opacity:.72;background:var(--tint)}
#bioin{--c1:#D3F1F3;--c2:#ADE2E7;--e:#62B0BA}
#gms,#xdl{--c1:#E8E0F9;--c2:#D0C2F1;--e:#9585C7}
#xprint{--c1:#DCEBFA;--c2:#B9D6F3;--e:#78A5D0}
#edtog{--c1:#FBF4C4;--c2:#F1E48F;--e:#BDAE45}
@page{size:landscape;margin:10mm}
@media print{
  body.printing{background:#fff!important}
  body.printing *{visibility:hidden}
  body.printing .pa,body.printing .pa *{visibility:visible}
  body.printing .pa{position:absolute;left:0;top:0;width:100%;box-shadow:none;border:0}
  body.printing .pa button,body.printing .pa select{display:none}
  body.printing::after{display:none}
  .xw{overflow:visible!important;border:0}.xt{font-size:9px}.xt th,.xt td{padding:4px 5px}
}
</style>

const ADMIN_EMAIL="kunalnandi56@gmail.com";
/* ================================================================ */

const configured=!/PASTE/.test(JSON.stringify(FIREBASE_CONFIG));
let app,auth,F,_sec;
const useLocal=(function(){try{const b=JSON.parse(localStorage.getItem("gf_bio")||"{}");return !!(b&&b.member)}catch(e){return false}})();
if(configured){app=initializeApp(FIREBASE_CONFIG);auth=initializeAuth(app,{persistence:inMemoryPersistence});F=getFirestore(app)}
const clean=o=>JSON.parse(JSON.stringify(o));
function getSec(){if(!_sec)_sec=getAuth(initializeApp(FIREBASE_CONFIG,"secondary"));return _sec}
window.GF={
  configured,admin:ADMIN_EMAIL,
  get auth(){return auth},
  db:{
    collection:c=>({doc:id=>({
      set:o=>setDoc(doc(F,c,id),clean(o)),
      update:o=>updateDoc(doc(F,c,id),clean(o)),
      delete:()=>deleteDoc(doc(F,c,id))})}),
    doc:p=>{const a=p.split("/");return{set:o=>setDoc(doc(F,a[0],a[1]),clean(o))}}
  },
  signIn:(email,pin)=>signInWithEmailAndPassword(auth,email,pin+"#gf"),
  isAdminDoc:async(uid)=>(await getDoc(doc(F,"admins",uid))).exists(),
  verify:async(email,pw)=>{const a=getSec();const c=await signInWithEmailAndPassword(a,email,pw);const u=c.user.uid;await signOut(a);return u},
  changePassword:async(email,cur,nw)=>{const cred=EmailAuthProvider.credential(email,cur+"#gf");await reauthenticateWithCredential(auth.currentUser,cred);await updatePassword(auth.currentUser,nw+"#gf")},
  persist:(on)=>setPersistence(auth,on?browserLocalPersistence:inMemoryPersistence),
  signInRaw:(e,p)=>signInWithEmailAndPassword(auth,e,p),
  signOut:()=>signOut(auth),
  onAuth:cb=>onAuthStateChanged(auth,cb),
  createUser:async(email,pin)=>{const a=getSec();const c=await createUserWithEmailAndPassword(a,email,pin+"#gf");await signOut(a);return c.user.uid},
  watch:(c,field,role,ok,er)=>{
    const u=auth.currentUser&&auth.currentUser.uid;
    const q=(role==="admin"||!field)?collection(F,c):query(collection(F,c),where(field,"==",u));
    return onSnapshot(q,ok,er)},
  watchDoc:(c,i,ok,er)=>onSnapshot(doc(F,c,i),ok,er)
};
window.dispatchEvent(new Event("gf-ready"));
</script>
</body>
</html>
